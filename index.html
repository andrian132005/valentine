<!DOCTYPE html>
<html>
<head>
    <title>Pentru iubirea mea ❤️</title>
    <style>
        body {
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            animation: fadeIn 2s ease-in-out;
        }

        h1 {
            font-size: 40px;
        }

        p {
            font-size: 20px;
        }

        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>La mulți ani de Ziua Îndrăgostiților ❤️</h1>
        <p>
            Fiecare zi cu tine este cel mai frumos cadou.  
            Îți mulțumesc că îmi faci viața mai frumoasă.  
            Te iubesc infinit! 💖
        </p>
    </div>
</body>
</html>
